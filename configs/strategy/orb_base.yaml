strategy_name: "intraday_orb_trend_continuation"
target_instrument: "MNQ"

opening_range:
  timeframe: "1m"
  window_minutes: 15
  buffer_ticks: 2

entry_filters:
  min_rvol_threshold: 1.00
  min_range_atr_ratio: 0.60
  max_range_atr_ratio: 2.50
  allow_vwap_retest: false           # Solo retesteo al nivel del ORB
  max_retest_bars: 25

exit_rules:
  stop_loss:
    mode: "structural"
    stop_atr_multiplier: 1.25
    min_stop_ticks: 40               # Suelo estructural
    hard_stop_max_ticks: 100          # Techo máximo permitido
    max_cost_ratio: 0.12             # Cost-gate
  take_profit:
    risk_reward_ratio: 2.20
  trade_management:
    scale_out_r: 1.00                # Cierre del 50% a +1R
    breakeven_r: 1.20                # BE + costes en el runner
    chandelier_trail_atr: 2.00
