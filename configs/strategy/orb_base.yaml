strategy_name: "intraday_orb_trend_continuation"
target_instrument: "MNQ"

opening_range:
  timeframe: "1m"
  window_minutes: 15
  buffer_ticks: 2

entry_filters:
  min_rvol_threshold: 1.00
  min_range_atr_ratio: 0.70
  max_range_atr_ratio: 2.20
  require_vwap_alignment: true
  max_entry_hour_est: "11:30:00"

exit_rules:
  stop_loss:
    mode: "dynamic_atr"
    atr_multiplier: 1.25
    hard_stop_max_ticks: 40
  take_profit:
    risk_reward_ratio: 2.50
  breakeven:
    enabled: true
    trigger_rr: 1.20
  trailing_stop:
    enabled: true
    trigger_rr: 1.80
    trailing_atr_multiplier: 1.00
