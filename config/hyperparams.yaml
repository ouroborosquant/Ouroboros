# FORTRESS v5 - hyperparams.yaml
# Path: config/hyperparams.yaml
#
# Global Hyperparameter and Dimensionality Mapping.
# Defines the exact tensor shapes to ensure all models align in VRAM.
#
# P2 CHANGES:
#   world_model.sde_method: 'euler' → 'milstein'
#     Strong convergence order 0.5 → 1.0. Required for valid CVaR estimates
#     in the 21-day stress test. Milstein eliminates O(√dt) per-step path bias.
#     dt is now 1/252 (annualised daily) — set in generate_synthetic_paths().
#
#   edt.lambda_econ, edt.lambda_calmar, edt.lambda_turnover:
#     Economic loss weights for the Sortino + Calmar + Turnover composite loss.
#     train_edt.py reads these as overrides; defaults are compiled into the trainer.

# ── GLOBAL SYSTEM SETTINGS ──────────────────────────────────────────
system:
  device: "cuda"
  log_level: "INFO"
  max_sequence_length: 252  # 1 Trading Year of context for transformers

# ── 1. REGIME ENCODER (Mamba-KAN VAE) ───────────────────────────────
mamba_kan:
  obs_dim: 52
  d_model: 256          # Renamed from hidden_dim
  latent_dim: 16
  n_mamba_layers: 4     # Used by mamba_kan_vae.py
  kan_width: [256, 128, 64, 16]
  n_mixture_components: 4
  learning_rate: 0.0001
  batch_size: 64
  epochs: 100

# ── 2. INTRADAY LIQUID NEURAL NET (LTC) ─────────────────────────────
ltc:
  input_size: 15          # Intraday micro-features (spread, volume pace, L2 imbalance)
  n_units: 64             # Number of continuous-time ODE neurons
  sparsity_level: 0.50    # AutoNCP wiring sparsity
  urgency_threshold: 0.70 # Triggers emergency execution bypass
  learning_rate: 0.001

# ── 3. PORTFOLIO ALLOCATOR (EDT) ────────────────────────────────────
edt:
  state_dim: 192          # obs_dim (52) + latent_dim (16) + alpha_dim (124)
  action_dim: 25          # Matches the ETF universe defined in universe.yaml
  d_model: 512            # Transformer hidden dimension
  n_heads: 8
  n_layers: 6
  diffusion_action_steps: 20
  learning_rate: 0.0003
  batch_size: 128
  epochs: 200
  # ── P2: Economic loss weights ──────────────────────────────────────
  lambda_econ: 0.30       # Total weight on economic loss vs DDPM denoising loss
  lambda_calmar: 0.20     # Calmar ratio weight within economic loss
  lambda_turnover: 0.10   # One-way turnover penalty coefficient

# ── 4. DEEP HEDGING NETWORK ─────────────────────────────────────────
hedging:
  latent_dim: 16          # Connects to Mamba-KAN output
  hedging_hidden_dim: 128
  cvar_alpha: 0.05        # Optimize for the worst 5% of synthetic trajectories

# ── 5. GRAPH ALPHA ENGINE (GATv2) ───────────────────────────────────
gat_alpha:
  node_feat_dim: 78       # Node features
  edge_feat_dim: 5        # Edge relationship types
  hidden_dim: 128
  n_heads: 8
  n_layers: 3
  epochs: 100

# ── 6. WORLD MODEL (Neural SDE) ─────────────────────────────────────
world_model:
  sde_state_dim: 25       # Simulating returns of the 25-asset universe
  latent_dim: 16          # Conditioned on Mamba-KAN regime
  hidden_dim: 128
  brownian_size: 10       # Number of independent stochastic shocks
  # P2 FIX: 'euler' → 'milstein'
  # Milstein achieves strong convergence order 1.0 for state-dependent diffusion.
  # Euler-Maruyama is O(√dt) per step; Milstein eliminates the leading error term
  # via the (g·∂g/∂y)·(ΔW²-dt)/2 correction computed by torchsde via forward-mode AD.
  sde_method: 'milstein'
  # dt is now enforced as 1/252 inside generate_synthetic_paths() — not set here.
  # The time grid is always in annualised units: ts = linspace(0, n_steps/252, n_steps+1).
  batch_size: 64
  epochs: 150

# ── 7. EXECUTION MARL ECOSYSTEM ─────────────────────────────────────
meta_controller:
  meta_input_dim: 20      # 16 (z_t) + 4 (tda, ltc, spread, vol)
  meta_hidden_dim: 64

stealth_ppo:
  stealth_state_dim: 12   # L2 Order Book state
  stealth_action_dim: 2   # [Price Offset, Size Fraction]
  stealth_hidden_dim: 128
  detectability_lambda: 0.15

urgent_ddpg:
  urgent_state_dim: 12
  urgent_action_dim: 2
  urgent_hidden_dim: 128

opport_sac:
  opport_state_dim: 12
  opport_action_dim: 2
  opport_hidden_dim: 128