meta_labeling:
  enabled: true
  model_type: "lightgbm"
  model_artifact_path: "src/models/weights/lgbm_orb_meta_v1.booster"
  execution_probability_cutoff: 0.35

triple_barrier_labeling:
  pt_multiplier: 2.5
  sl_multiplier: 1.25
  max_holding_bars_5m: 24

feature_set:
  - "rvol_opening_range"
  - "range_to_atr_ratio"
  - "distance_to_vwap_zscore"
  - "confidence_score"

training:
  cv_splits: 5
  cv_type: "combinatorial_purged"
  embargo_pct: 0.02
