[tool.poetry]
name = "orb-futures-system"
version = "0.1.0"
description = "Algorithmic Intraday ORB & Meta-Labeling Trading System for CME Futures (Prop Firm Ready)"
authors = ["Quantitative Engineering Team <quant@trading.local>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^1.26.4"
pandas = "^2.2.2"
polars = "^1.8.0"
pyarrow = "^17.0.0"
scipy = "^1.14.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.4.0"
pyyaml = "^6.0.2"
python-dotenv = "^1.0.1"

# Optimización y Machine Learning
scikit-learn = "^1.5.1"
lightgbm = "^4.5.0"
optuna = "^3.6.1"
cvxpy = "^1.5.2"
clarabel = "^0.9.0"

# Análisis Técnico y Métricas Cuantitativas
pandas-ta = "^0.3.14b"
quantstats = "^0.0.62"

# Conectividad Asíncrona y Brokers
aiohttp = "^3.10.5"
websockets = "^13.0.1"
requests = "^2.32.3"
ib-insync = {version = "^0.9.86", optional = true}

# Telemetría y Monitoreo
loguru = "^0.7.2"
rich = "^13.8.0"
streamlit = "^1.38.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.4"
mypy = "^1.11.2"
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true