# FORTRESS v5 - universe.yaml
# Path: config/universe.yaml
#
# Defines the expanded 100-asset investable universe.
# The dimensionality of this file dictates the output dimension 
# of the GAT alpha vector and the EDT action space.
#
# Liquidity Tiers (enforced by config/risk_limits.yaml):
#   Tier 1: Max position 25% (Broad equity, mega-cap fixed income, primary safe havens)
#   Tier 2: Max position 15% (Sector equity, emerging markets, standard commodities, mega-cap singles)
#   Tier 3: Max position 5%  (Volatility proxies, highly constrained assets, large-cap singles)

